<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kayla & CJ - Save the Date</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <main class="page">

    <div class="wedding-experience">

      <!-- =========================
           ENVELOPE EXPERIENCE
      ========================== -->

      <div
        class="envelope"
        id="envelope"
      >

        <!-- Realistic Save the Date card -->
        <img
          src="images/save-the-date-card.png"
          alt="Save the Date for Kayla and CJ on June 11, 2027 in Richboro, Pennsylvania"
          class="save-the-date-card"
        >

        <!-- Realistic floral envelope -->
        <img
          src="images/envelope-body.png"
          alt="Wedding envelope for Kayla and CJ"
          class="envelope-body"
        >

        <!-- Separate wax seal -->
        <img
          src="images/wax-seal.png"
          alt=""
          class="wax-seal"
        >

      </div>


      <!-- =========================
           OPEN INSTRUCTION
      ========================== -->

      <p class="open-text">
        Tap the envelope to open
      </p>


      <!-- =========================
           PHYSICAL COPY BUTTON
      ========================== -->

      <button
        class="physical-copy-btn"
        type="button"
      >
        Want a Physical Copy?
      </button>


      <!-- =========================
           ADDRESS FORM
      ========================== -->

      <div class="address-form-container">

        <form class="address-form">

          <h2>
            Where should we send it?
          </h2>

          <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
          >

          <input
            type="text"
            name="street"
            placeholder="Street Address"
            required
          >

          <input
            type="text"
            name="apartment"
            placeholder="Apartment / Suite (optional)"
          >

        <div class="address-row">

          <input
            type="text"
            name="city"
            placeholder="City"
            required
          >

          <input
            type="text"
            name="state"
            placeholder="State"
            required
          >

          <input
            type="text"
            name="zip"
            placeholder="ZIP Code"
            required
          >

        </div>

          <button
            type="submit"
            class="submit-address-btn"
          >
            Submit Address
          </button>

        </form>


        <!-- Temporary success message -->
        <div class="success-message">

          <div class="success-heart">
            ♥
          </div>

          <h2>Thank You!</h2>

          <p>
            Your mailing address has been received.
          </p>

          <p>
            We'll send your Save the Date soon!
          </p>

          <div class="success-divider">
            ❦
          </div>

          <p class="success-names">
            Kayla &amp; CJ
          </p>

        </div>

      </div>

    </div>

  </main>


  <script src="js/script.js"></script>

</body>

</html>
